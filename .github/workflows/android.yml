name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: |
          mkdir -p test-results
          javac -d test-results tests/PolicyTest.java tests/LessonClockTest.java tests/ReminderPlannerTest.java tests/UpdatePolicyTest.java app/src/main/java/top/syuct/timetable/Policy.java app/src/main/java/top/syuct/timetable/LessonClock.java app/src/main/java/top/syuct/timetable/ReminderPlanner.java app/src/main/java/top/syuct/timetable/UpdatePolicy.java
          java -cp test-results PolicyTest
          java -cp test-results LessonClockTest
          java -cp test-results ReminderPlannerTest
          java -cp test-results UpdatePolicyTest
          javac -d test-results tests/CountdownTextTest.java app/src/main/java/top/syuct/timetable/CountdownText.java
          java -cp test-results top.syuct.timetable.CountdownTextTest
      - name: Verify update manifest parsing and HTTPS rules
        run: |
          curl --fail --location --max-time 30 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o test-results/json-test.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  test-results/json-test.jar' | sha256sum -c -
          javac -cp test-results/json-test.jar -d test-results tests/UpdateCheckerTest.java app/src/main/java/top/syuct/timetable/UpdatePolicy.java app/src/main/java/top/syuct/timetable/UpdateChecker.java
          java -cp test-results:test-results/json-test.jar top.syuct.timetable.UpdateCheckerTest
      - run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-for-development
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/
            test-results/
